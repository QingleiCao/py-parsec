[build-system]
requires = ["setuptools>=77", "Cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-parsec"
version = "0.1.0"
description = "Python bindings for the PaRSEC task-based runtime system"
readme = "README.md"
license = "BSD-3-Clause-Open-MPI"
license-files = ["LICENSE"]
authors = [{ name = "Qinglei Cao" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
keywords = ["parsec", "task-based runtime", "dataflow", "DTD", "PTG", "MPI", "HPC"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/QingleiCao/py-parsec"
Issues = "https://github.com/QingleiCao/py-parsec/issues"
Changelog = "https://github.com/QingleiCao/py-parsec/blob/main/CHANGELOG.md"
PaRSEC = "https://github.com/ICLDisco/parsec"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["py_parsec"]

[tool.setuptools.package-data]
py_parsec = ["*.pxd", "*.h"]

[tool.setuptools.exclude-package-data]
py_parsec = ["*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
